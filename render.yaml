services:
  - type: web
    name: gout-gueule
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/lib/goutgueule/storage
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Required before enabling email magic links. Use a Gmail App Password,
      # never a regular account password. Sender must be goutgueule.ia@gmail.com.
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://gout-gueule-fcvr.onrender.com
    disk:
      name: goutgueule-storage
      mountPath: /var/lib/goutgueule/storage
      sizeGB: 1
